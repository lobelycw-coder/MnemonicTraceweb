services:
  - type: web
    name: seedhunter
    runtime: docker
    dockerfilePath: ./infra/Dockerfile.api
    plan: free
    healthCheckPath: /stats
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: seedhunter-db
          property: connectionString
      - key: SHARD_PATH
        value: /app/data/shard.bin

databases:
  - name: seedhunter-db
    plan: free